                  builds locally AND installs cleanly from the COPR repo can be
                  pushed with high confidence. If the local rebuild uses the
                  ackerman/nexus copr for deps, it also proves the dependency
                  chain resolves in the real repo - catch "nothing provides"
                  before users do. Building locally is NOT a substitute for the
                  real COPR build (different chroot flags, older repo snapshots)
                  - the COPR build is still the authority for "shipped", local
