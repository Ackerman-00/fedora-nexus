name: opencode-schedule

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  artifact-metadata: write
  contents: write
  pull-requests: write
  issues: write
  actions: write
  models: read

concurrency:
  group: opencode-schedule
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      artifact-metadata: write
      contents: write
      pull-requests: write
      issues: write
      actions: write
      models: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.REPO_FULL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (latest, resilient)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p "$HOME/.opencode/bin"
          export PATH="$HOME/.opencode/bin:$PATH"
          for i in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors https://opencode.ai/v2/install | bash; then
              break
            fi
            echo "opencode install attempt $i/4 failed - sleeping 30s"
            sleep 30
          done
          if ! command -v opencode >/dev/null 2>&1; then
            echo "official installer failed - trying npm"
            npm install -g @opencode/cli || sudo npm install -g @opencode/cli || true
            if command -v opencode >/dev/null 2>&1; then
              ln -sf "$(command -v opencode)" "$HOME/.opencode/bin/opencode"
            fi
          fi
          if ! command -v opencode >/dev/null 2>&1; then
            echo "FATAL: opencode install failed (installer + npm exhausted)" >&2
            exit 1
          fi
          command -v opencode && opencode --version
          ver="$(opencode --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          case "$ver" in
            0.*|1.*) echo "FATAL: opencode $ver is not V2 (needs >=2.x) - aborting run" >&2; exit 1 ;;
            2.*) echo "opencode version OK: $ver (V2)" ;;
            *) echo "FATAL: could not parse opencode version from '$ver'" >&2; exit 1 ;;
          esac

      - name: Run opencode
        shell: bash
        timeout-minutes: 300
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          gate_passes() {
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1 || true
            local content=""
            content="$(git show origin/main:.opencode-relay.md 2>/dev/null || true)"
            if [ -z "$content" ]; then
              content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.opencode-relay.md?ref=main" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            fi
            grep -qx "run_id: $RUN_ID" <<< "$content" || return 1
            content=$(printf '%s\n' "$content" | awk -v id="run_id: $RUN_ID" '$0==id{f=1;next} f&&/^run_id: /{exit} f')
            grep -qix "status: complete" <<< "$content" || return 1
            grep -q "| package | upstream deps found |" <<< "$content" || return 1
            local expected dep_rows unproven_rows tool today yest pkg
            expected=$(ls */*.spec 2>/dev/null | wc -l)
            [ "$expected" -gt 0 ] || return 1
            dep_rows=$(printf '%s' "$content" | grep -oE "^\| [a-zA-Z0-9._+-]+ \|.*\| (deps-verified|deps-fixed|version-checked|retired-stub) \|" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | sort -u | wc -l || true)
            [ "$dep_rows" -ge "$expected" ] || return 1
            unproven_rows=$(printf '%s' "$content" | grep -oE "^\| [a-zA-Z0-9._+-]+ \|.*unproven:" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | sort -u | wc -l || true)
            [ "$unproven_rows" -ge "$expected" ] || return 1
            today=$(date -u +%F); yest=$(date -u -d yesterday +%F 2>/dev/null || date -u -v-1d +%F)
            local upstream_rows
            upstream_rows=$(printf '%s' "$content" | grep -E "upstream: [a-zA-Z0-9._+-]+ .*($today|$yest)" | grep -oE "upstream: [a-zA-Z0-9._+-]+" | awk '{print $2}' | sort -u | wc -l || true)
            [ "$upstream_rows" -ge "$expected" ] || return 1
            for pkg in $(printf '%s' "$content" | grep -oE "^\| [a-zA-Z0-9._+-]+ \|.*\| version-checked \|" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | sort -u); do
              grep -qE "upstream: $pkg .*($today|$yest)" <<< "$content" || return 1
            done
            for pkg in $(printf '%s' "$content" | grep -oE "^\| [a-zA-Z0-9._+-]+ \|.*\| (deps-verified|deps-fixed) \|" | awk -F'|' '{gsub(/ /,"",$2); print $2}' | sort -u); do
              grep -qiE "docker-teardown: $pkg .*PASS.*($today|$yest)" <<< "$content" || return 1
            done
            local slice_line slice_pkgs slice_n min_slice
            slice_line=$(grep -m1 -E "^teardown-slice:" <<< "$content" || true)
            [ -n "$slice_line" ] || return 1
            slice_pkgs=$(printf '%s' "$slice_line" | sed -E 's/^teardown-slice: *//; s/ *\|.*$//')
            slice_n=$(printf '%s\n' $slice_pkgs | grep -c . || true)
            min_slice=$(( (expected + 3) / 4 ))
            [ "$slice_n" -ge "$min_slice" ] || return 1
            for pkg in $slice_pkgs; do
              grep -qiE "docker-teardown: $pkg .*PASS.*($today|$yest)" <<< "$content" || return 1
            done
            local mains_pkg
            mains="$(bash tools/verify-fedora.sh --print-mains)"
            for mains_pkg in $mains; do
              grep -qiE "docker-teardown: $mains_pkg .*PASS.*($today|$yest)" <<< "$content" || return 1
              grep -qiE "upstream: $mains_pkg .*($today|$yest)" <<< "$content" || return 1
            done
            local g_decl g_head g_cls g_act g_need g_unclass
            g_decl=$(grep -ciE "^[[:space:]]*([-*][[:space:]]*)?((GAP|HOLD)[[:space:]]*:|not verified\b)" <<< "$content" || true)
            g_head=$(grep -ciE "^[[:space:]]*([-*][[:space:]]*)?((GAP|HOLD)[[:space:]]*:|not verified\b)[^:]*:[[:space:]]*$" <<< "$content" || true)
            g_cls=$(grep -ciE "^[[:space:]]*([-*][[:space:]]*)?((GAP|HOLD)[[:space:]]*:[[:space:]]*(external|actionable)|not verified\b.*\b(external|actionable)\b|(GAP|HOLD)[[:space:]]*:[[:space:]]*(none|nothing|n/a)\b|not verified\b[ 	]*:?[ 	]*(none|nothing|n/a)\b)" <<< "$content" || true)
            g_act=$(grep -ciE "^[[:space:]]*([-*][[:space:]]*)?((GAP|HOLD)[[:space:]]*:[[:space:]]*actionable|not verified\b.*\bactionable\b)" <<< "$content" || true)
            g_need=$(( g_decl - g_head ))
            g_unclass=$(( g_need - g_cls ))
            [ "$g_unclass" -lt 0 ] && g_unclass=0
            [ "$g_act" -eq 0 ] || return 1
            [ "$g_unclass" -eq 0 ] || return 1
            for tool in "rpmspec -P" "dnf builddep" "rpmlint"; do
              grep -qi "$tool.*PASS\|PASS.*$tool" <<< "$content" || return 1
            done
            grep -q "| package | packaged version |" <<< "$content" || return 1
            grep -qi "install-test table" <<< "$content" || grep -qiE "\| package \| (chroot \| )?COPR build \|" <<< "$content" || return 1
            local it_rows it_fail it_pass it_pkg
            it_rows=$(printf '%s' "$content" | awk -F'|' '
              /^\|/ {
                n = split($0, a, "|");
                if (n < 3) next;
                verdict = "";
                for (i = 2; i <= n; i++) {
                  c = a[i];
                  gsub(/^[ \t]+|[ \t]+$/, "", c);
                  lc = tolower(c);
                  if (lc == "pass" || lc == "ok" || lc == "installable" || lc == "fixed") { verdict = "PASS"; continue }
                  if (lc == "fail" || lc == "broken" || lc ~ /^broken[-_(]/) { verdict = "FAIL"; continue }
                  if (lc == "external" || lc == "blocked" || lc ~ /^blocked[-_(]/) { verdict = "EXTERNAL"; continue }
                }
                if (verdict == "") next;
                pkg = a[2];
                gsub(/^[ \t]+|[ \t]+$/, "", pkg);
                if (pkg == "" || pkg == "package") next;
                printf "%s %s\n", pkg, verdict;
              }' | sort -u)
            it_fail=$(grep -c ' FAIL$' <<< "$it_rows" || true)
            it_pass=$(grep -c ' PASS$' <<< "$it_rows" || true)
            [ "$it_fail" -eq 0 ] || return 1
            [ $(( it_fail + it_pass )) -ge 10 ] || return 1
            for mains_pkg in $mains; do
              if ! grep -qx "$mains_pkg PASS" <<< "$it_rows"; then
                if grep -qx "$mains_pkg EXTERNAL" <<< "$it_rows" && grep -qiE "GAP: external.*$mains_pkg" <<< "$content"; then
                  continue
                fi
                return 1
              fi
            done
            for it_pkg in $(awk '{print $1}' <<< "$it_rows"); do
              if grep -qE "docker-teardown: $it_pkg .*install PASS" <<< "$content" && grep -qx "$it_pkg FAIL" <<< "$it_rows"; then
                return 1
              fi
            done
            local changed_line changed_pkgs
            changed_line=$(grep -m1 -E "^[[:space:]]*changed:" <<< "$content" || true)
            [ -n "$changed_line" ] || return 1
            changed_pkgs=$(printf '%s' "$changed_line" | sed -E 's/^[[:space:]]*changed:[[:space:]]*//')
            for it_pkg in $changed_pkgs; do
              if ! grep -qx "$it_pkg PASS" <<< "$it_rows"; then
                if grep -qx "$it_pkg EXTERNAL" <<< "$it_rows" && grep -qiE "GAP: external.*$it_pkg" <<< "$content"; then
                  continue
                fi
                return 1
              fi
            done
            for ext_pkg in $(awk '$2=="EXTERNAL"{print $1}' <<< "$it_rows"); do
              grep -qiE "GAP: external.*$ext_pkg" <<< "$content" || return 1
            done
            local d_found d_fixed hunt_cats
            d_found=$(grep -oE '^[[:space:]]*defects-found:[[:space:]]*[0-9]+' <<< "$content" | tail -1 | grep -oE '[0-9]+' || true)
            d_fixed=$(grep -oE '^[[:space:]]*defects-fixed:[[:space:]]*[0-9]+' <<< "$content" | tail -1 | grep -oE '[0-9]+' || true)
            [ -n "$d_found" ] && [ -n "$d_fixed" ] || return 1
            [ "$d_fixed" -ge "$d_found" ] || [ $(( d_fixed + g_decl )) -ge "$d_found" ] || return 1
            hunt_cats=$(grep -oE '^[[:space:]]*hunt: [a-z0-9-]+' <<< "$content" | sort -u | wc -l || true)
            [ "$hunt_cats" -ge 5 ] || return 1
            return 0
          }
          sleep $((RANDOM % 180))
          DEADLINE_EPOCH=$(date -u +%s); DEADLINE_EPOCH=$((DEADLINE_EPOCH + 250*60))
          DEADLINE_UTC=$(date -u -d @$DEADLINE_EPOCH +%Y-%m-%dT%H:%MZ)
          echo "RUN_DEADLINE_UTC=$DEADLINE_UTC" >> $GITHUB_ENV
          echo "DEADLINE_EPOCH=$DEADLINE_EPOCH" >> $GITHUB_ENV
          mapfile -t CASCADE < <(bash tools/model-cascade.sh 2>/dev/null)
          if [ "${#CASCADE[@]}" -eq 0 ]; then
            CASCADE=(opencode/mimo-v2.6-flash-free opencode/deepseek-v4.1-flash-free)
          fi
          echo "=== free-model cascade: ${CASCADE[*]} ==="
          for model in "${CASCADE[@]}"; do
            echo "=== opencode run attempt with $model ==="
            exit_code=0
            for attempt_n in 1 2 3; do
              # prompt via file: env/argv strings > 128KiB hit MAX_ARG_STRLEN (E2BIG)
              if timeout --signal=TERM --kill-after=60s 250m opencode run --standalone --model "$model" --agent build < tools/sweep-prompt.md; then
                exit_code=0
                break
              else
                exit_code=$?
              fi
              if [ "$attempt_n" -lt 3 ]; then
                delay=$((RANDOM % (120 * attempt_n)))
                echo "=== $model try $attempt_n/3 failed (exit $exit_code) - backing off ${delay}s ==="
                sleep "$delay"
              fi
            done
            if [ "$exit_code" -eq 0 ]; then
              ok=0
              for attempt in $(seq 1 10); do
                if gate_passes; then
                  ok=1
                  break
                fi
                echo "=== gate attempt $attempt: relay not confirmed yet (origin/main=$(git rev-parse --short origin/main 2>/dev/null || echo missing)) - retrying ==="
                sleep 45
              done
              if [ "$ok" -eq 1 ]; then
                echo "=== $model completed the full job (.opencode-relay.md on main confirms run $RUN_ID complete) ==="
                exit 0
              fi
              echo "=== $model exited 0 but .opencode-relay.md on main does not confirm run $RUN_ID complete - run is INCOMPLETE, treating as failure ==="
            else
              echo "=== attempt with $model failed (exit $exit_code) - trying next ==="
            fi
            sleep 60
          done
          exit 1
        env:
          MODEL: opencode/deepseek-v4.1-flash-free
          OPENCODE_CONFIG_CONTENT: '{"agents":{"title":{"model":"opencode/mimo-v2.6-flash-free"}},"websearch":{"provider":"random"}}'
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_ACCESS_TOKEN: ${{ secrets.REPO_FULL_ACCESS_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
      - name: Preserve relay checkpoint
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
        run: |
          [ -f .opencode-relay.md ] || : > .opencode-relay.md
          if ! grep -qx "run_id: $RUN_ID" .opencode-relay.md; then
            { printf 'run_id: %s\nstatus: unfinished\n\n### Handoff (synthesised by the checkpoint step)\n- This run ended without writing its own block; no evidence was recorded.\n- Run: %s/%s/actions/runs/%s\n- Continue from the last block below; it is the last proven state.\n\n' \
                "$RUN_ID" "${GITHUB_SERVER_URL:-https://github.com}" "${GITHUB_REPOSITORY:-}" "$RUN_ID"
              cat .opencode-relay.md; } > .opencode-relay.md.new
            mv .opencode-relay.md.new .opencode-relay.md
            echo "synthesised an owned unfinished block for run $RUN_ID"
          fi
          git fetch -q origin main || true
          if git show origin/main:.opencode-relay.md 2>/dev/null | cmp -s - .opencode-relay.md; then
            echo "relay on main already matches this run - nothing to preserve"
            exit 0
          fi
          blob=$(git hash-object -w .opencode-relay.md)
          export GIT_INDEX_FILE=$(mktemp -u)
          git read-tree origin/main
          git update-index --add --cacheinfo "100644,$blob,.opencode-relay.md"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p origin/main -m "chore(relay): preserve run $RUN_ID checkpoint")
          rm -f "$GIT_INDEX_FILE"
          git push origin "$commit:main" || { echo "::warning::checkpoint push rejected (concurrent push?) - the run's own push stands"; exit 0; }
          echo "checkpoint committed as $commit"

      - name: Verify completion (external, battle-tested 2026)
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== External verifier: tools/verify-fedora.sh ==="
          git fetch -q origin main && git reset -q --hard origin/main || true
          bash tools/verify-fedora.sh || {
            echo "::error::Verification FAILED -- see ----- VERIFICATION REPORT ----- above for the exact failed check (often one evidence string, not the tables). Fix the listed gap, not the whole audit. Gate will retry with stronger model."
            exit 1
          }

      - name: Upload opencode logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-logs
          path: ~/.local/share/opencode/log/
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: opencode
    permissions:
      artifact-metadata: write
      contents: write
      pull-requests: write
      issues: write
      actions: write
      models: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open failure issue
        if: needs.opencode.result != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="autonomous run failed: $(date -u +%Y-%m-%d)"
          exists=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$exists" -eq 0 ]; then
            gaps=$(RUN_ID=$GITHUB_RUN_ID bash tools/verify-fedora.sh 2>&1 | grep -E '^FAIL' | head -20 || true)
            [ -n "$gaps" ] || gaps="(the verifier produced no FAIL lines - the run died before the relay block was written)"
            body=$(printf 'The scheduled autonomous maintenance run failed at %s.\n\nRun: https://github.com/%s/actions/runs/%s\n\nThe next scheduled run owns this issue: read the failing checks below, fix the cause in the repo, push the fix, and close this issue with the evidence.\n\n```\n%s\n```\n' "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_REPOSITORY}" "$GITHUB_RUN_ID" "$gaps")
            gh api repos/${GITHUB_REPOSITORY}/issues -f title="$title" -f body="$body"
          else
            echo "failure issue for today already open - skipping"
          fi

      - name: Close failure issue on success
        if: needs.opencode.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.title | startswith("autonomous run failed")) | .number'); do
            echo "Closing failure issue #$n (run $GITHUB_RUN_ID succeeded, verification passed)"
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/$n" -f state=closed -f state_reason=completed >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/issues/$n/comments" -f body="Closed automatically: the next scheduled run (\`$GITHUB_RUN_ID\`) passed verification (\`tools/verify-fedora.sh\` exit 0, relay \`run_id: $GITHUB_RUN_ID\` + \`status: complete\`). See https://github.com/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID." >/dev/null || true
          done

      - name: Clean up stray opencode/schedule branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ref in $(gh api repos/${GITHUB_REPOSITORY}/branches --paginate --jq '.[].name' | grep '^opencode/schedule-'); do
            echo "Deleting stray branch: $ref"
            gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/heads/"$ref" 2>/dev/null || echo "  (already deleted or not found)"
          done
