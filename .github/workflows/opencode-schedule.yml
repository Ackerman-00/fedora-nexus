                  push but THIS package never builds even after several pushes,
                  treat the webhook/source-type config for that package as
                  broken: the webhook URL in COPR project Settings -> Webhooks
                  (github/<id>/<uuid>/) may be dead or the package source type
                  may not be scm/github. You cannot repair it via the unauthed
                  API - record the problem in .opencode-relay.md, keep main
                  clean, and file an issue titled "COPR webhook not firing for
                  <pkg>" with the evidence (delivery history + push SHAs vs
                  build list timestamps).
                 - FINAL GATE CHECK: in your final summary state for EVERY
                  package you pushed the webhook delivery id/status AND the
                  post-push build id that proves it, or name it as an
                  unverified gap.

