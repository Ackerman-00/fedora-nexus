               a. WEBHOOK-FIRING VERIFICATION (MANDATORY - the COPR<->GitHub
                  webhook is the ONLY thing that turns your pushes into builds).
                  READ THE WEBHOOK DIRECTLY INSTEAD OF GUESSING: GitHub records
                  every configured webhook and its delivery history, so you can
                  SEE the connection itself:
                    - List the repo's webhooks:
                      `gh api repos/Ackerman-00/fedora-nexus/hooks --paginate`
                      The COPR hook is the one whose config.url contains
                      "copr.fedorainfracloud.org/webhooks/github". Confirm it
                      exists and is "active": tab the JSON.
                    - Inspect recent deliveries for that hook id:
                      `gh api repos/Ackerman-00/fedora-nexus/hooks/<id>/deliveries`
                      then read the actual delivery payloads/status
                      (`.../hooks/<id>/deliveries/<delivery_id>`): you can see
                      whether COPR ACKNOWLEDGED each push you made (status 200
                      / 2xx = delivered). This is empirical proof the webhook
                      connection is alive - not a guess.
                    - Also confirm the COPR side empirically every time you push
                      a fix: BEFORE push record the newest build id for the
                      package (GET .../build/list?...&packagename=<pkg>); PUSH
                      to main; AFTER push re-query the build list - the webhook
                      works only if a NEW build appeared shortly after the push.
                      A "skipped" state is NORMAL and means the webhook fired
                      but the NVR did not change - that is the smell to watch:
                      if your fix kept Release the same (violating RELEASE
                      REVISION DISCIPLINE), COPR will "skip" it and users never
                      get the fix. "skipped" therefore equals "fix not shipped"
                      - fix the Release and push again.
