                  FIX (MANDATORY when a build failed - never fix blind and
                  push, guessing). Waiting on the COPR queue wastes a full push
                  cycle per guess. Instead, once you have a hypothesis, BUILD
                  the package in a clean Fedora container matching the failing
                  chroot and PROVE the fix compiles there before you commit:
                  docker run --rm -v "$PWD:/srv" \
                    registry.fedoraproject.org/fedora:<N> bash -lc '
                      dnf -y --setopt=gpgcheck=0 install dnf-plugins-core rpm-build rpmdevtools
                      dnf -y --setopt=gpgcheck=0 copr enable ackerman/nexus
                      cd /srv/<pkg>
                      dnf -y --setopt=gpgcheck=0 builddep <pkg>.spec
                      mkdir -p /root/rpmbuild/{SOURCES,BUILD,BUILDROOT,RPMS,SRPMS,SPECS}
                      for i in 1 2 3; do spectool -g -C /root/rpmbuild/SOURCES <pkg>.spec && break; sleep 5; done
                      ls -la /root/rpmbuild/SOURCES
                      rpmbuild -bb <pkg>.spec
                    '
