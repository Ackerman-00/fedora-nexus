name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-oc
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/oc\n') ||
       github.event.comment.body == '/oc' ||
       startsWith(github.event.comment.body, '/opencode ') ||
       startsWith(github.event.comment.body, '/opencode\n') ||
       github.event.comment.body == '/opencode')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          token: ${{ secrets.REPO_FULL_ACCESS_TOKEN || github.token }}

      - name: Configure git auth for pushes
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "41898282+opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.REPO_FULL_ACCESS_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install opencode (latest, resilient)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p "$HOME/.opencode/bin"
          export PATH="$HOME/.opencode/bin:$PATH"
          for i in 1 2 3 4; do
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors https://opencode.ai/v2/install | bash; then
              break
            fi
            echo "opencode install attempt $i/4 failed - sleeping 30s"
            sleep 30
          done
          if ! command -v opencode >/dev/null 2>&1; then
            echo "official installer failed - trying npm"
            npm install -g @opencode/cli || sudo npm install -g @opencode/cli || true
            if command -v opencode >/dev/null 2>&1; then
              ln -sf "$(command -v opencode)" "$HOME/.opencode/bin/opencode"
            fi
          fi
          # 3) REMOVED: the gh-release fallback pulled opencode-ai/opencode
          # (last release v0.0.55, 2025-06-27) - not V2. npm @opencode/cli is
          # the only authenticated V2 source. If both installer and npm fail,
          # abort: installing a stale binary is worse than no run.
          if ! command -v opencode >/dev/null 2>&1; then
            echo "FATAL: opencode install failed (installer + npm exhausted)" >&2
            exit 1
          fi
          # Hard gate: every later step assumes `opencode` exists.
          command -v opencode && opencode --version
          # V1 tripwire (REAL INCIDENT 2026-09-21: the V1 installer ships
          # opencode 1.x, which reads V1 flags - fail fast, never run V1).
          ver="$(opencode --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          case "$ver" in
            0.*|1.*) echo "FATAL: opencode $ver is not V2 (needs >=2.x) - aborting run" >&2; exit 1 ;;
            2.*) echo "opencode version OK: $ver (V2)" ;;
            *) echo "FATAL: could not parse opencode version from '$ver'" >&2; exit 1 ;;
          esac

      - name: Build prompt from triggering issue/PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: ${{ github.event.comment.body }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            KIND="issue"
            NUMBER="$ISSUE_NUMBER"
            CONTEXT=$(gh issue view "$ISSUE_NUMBER" --json title,body,state,author --jq '"Author: \(.author.login)\nState: \(.state)\nTitle: \(.title)\n\n\(.body)"' 2>/dev/null || echo "(could not fetch issue)")
          else
            KIND="pull request"
            NUMBER="$PR_NUMBER"
            CONTEXT=$(gh pr view "$PR_NUMBER" --json title,body,state,author --jq '"Author: \(.author.login)\nState: \(.state)\nTitle: \(.title)\n\n\(.body)"' 2>/dev/null || echo "(could not fetch PR)")
          fi
          {
            echo "PROMPT<<PROMPT_EOF"
            printf 'You are the fully autonomous maintainer of fedora-nexus (https://github.com/Ackerman-00/fedora-nexus). A user invoked you with /oc. Handle %s #%s. The triggering comment was: %s\n\n--- CONTEXT ---\n%s\n--- END CONTEXT ---\n\nTASKS:\n1. INVESTIGATE: reproduce/diagnose the report. Web-search to verify every version, URL, and checksum - never trust the report or your memory alone.\n2. If it is a genuine packaging bug (missing dep, wrong version, broken COPR build/install, broken update.sh): fix the spec/update.sh/workflow directly, commit to main (git fetch origin && git pull --rebase origin main first; pushing triggers COPR auto-builds), verify the COPR build succeeds, and install-test the built RPM in a clean Fedora container before closing.\n3. If it is user error, already implemented, or a duplicate: say so clearly and kindly with evidence.\n4. ALWAYS leave a comment on %s #%s with your verdict and evidence (gh %s comment / gh %s close).\n5. NEVER create pull requests. Work directly on main. Never echo or paste any tokens.\n5b. COPR WRITE ACCESS: if the fix needs a missing COPR package record, a webhook/source-type repair, or a chroot enablement, do it yourself (COPR_LOGIN/COPR_USERNAME/COPR_TOKEN are in env when the owner stored them: pip install copr-cli, write ~/.config/copr via printf with FOUR keys (login, username, token, copr_url = https://copr.fedorainfracloud.org - without copr_url copr-cli crashes with a NoneType startswith error, which is a config bug, never an expired token), verify with copr-cli whoami, never print secrets; add-package-scm / edit-package-scm, then verify with get-package + build list). If auth fails the token expired: say so in your comment and add it to the needs-owner list.\n6. COMPLETION RECORD (MANDATORY): when done, never delete .opencode-relay.md; update it with your summary/evidence, set its status line to `status: complete`, add a `run_id: %s` line, and commit + push it. The workflow verifies the relay on main after you exit (status complete + this run_id); without it your run is treated as failed.\n7. GIT IDENTITY (MANDATORY - ONLY opencode-agent[bot], NOTHING ELSE): commit exclusively as opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com> (already set via git config and the GIT_AUTHOR_*/GIT_COMMITTER_* env vars). NEVER run git config user.name/user.email, NEVER pass --author/--committer, NEVER add Co-Authored-By or Signed-off-by trailers, NEVER invent or guess any noreply email. WHY: a past opencode run committed with an invented identity and GitHub attributed those commits to a real human account (OpenCode Apruzzese Francesco) - a stranger appeared as the author. After EVERY commit verify: git log -1 --format="%%an <%%ae>" must print exactly opencode-agent[bot] <41898282+opencode-agent[bot]@users.noreply.github.com> and git show -s --format=%%B HEAD | grep -ci co-authored must print 0. If a check fails: git commit --amend --reset-author --no-edit, re-verify, then git fetch origin && git pull --rebase origin main and push --force-with-lease. NEVER leave a misattributed commit on main.\n' \
              "$KIND" "$NUMBER" "$COMMENT" "$CONTEXT" "$KIND" "$NUMBER" "$KIND" "$KIND" "$RUN_ID"
            echo "PROMPT_EOF"
          } >> "$GITHUB_ENV"

      - name: Run opencode
        shell: bash
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          # MODEL FRESHNESS: verify ids against https://opencode.ai/zen/v1/models
          # each run; drop dead ids, append newer free models.
          for model in "opencode/fledge-alpha-free" "opencode/muse-spark-1.3-contributor-free" "opencode/mimo-v2.6-flash-free" "opencode/mimo-v2.5-free" "opencode/big-pickle" "opencode/nemotron-3.5-lightning-free" "opencode/nemotron-3-ultra-free" "opencode/ling-3.0-flash-fin-free" "opencode/ling-3.1-flash-free" "opencode/deepseek-v4-flash-free" "opencode/space-bunny-free" "opencode/longcat-2.5-preview-free" "opencode/muse-spark-1.2-contributor-free"; do
            echo "=== opencode run attempt with $model ==="
            if MODEL="$model" opencode run --standalone --model "$model" --agent build "$PROMPT"; then
              git fetch origin main >/dev/null 2>&1
              if git show origin/main:.opencode-relay.md 2>/dev/null | grep -qx "run_id: $RUN_ID" && git show origin/main:.opencode-relay.md 2>/dev/null | grep -qi "status: complete"; then
                echo "=== $model completed (.opencode-relay.md on main confirms run $RUN_ID complete) ==="
                exit 0
              fi
              echo "=== $model exited 0 but .opencode-relay.md on main does not confirm run $RUN_ID complete - run is INCOMPLETE, treating as failure ==="
            else
              echo "=== attempt with $model failed (exit $?) - trying next ==="
            fi
            sleep 15
          done
          exit 1
        env:
          MODEL: opencode/fledge-alpha-free
          OPENCODE_CONFIG_CONTENT: '{"agents":{"title":{"model":"opencode/mimo-v2.5-free"}}}'
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: opencode-agent[bot]
          GIT_AUTHOR_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: opencode-agent[bot]
          GIT_COMMITTER_EMAIL: 41898282+opencode-agent[bot]@users.noreply.github.com

      - name: Verify completion (external)
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          bash tools/verify-fedora.sh || { echo "::error::relay evidence incomplete"; exit 1; }
