name: Fedora Nexus Auto-Updater

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (priority repo)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # The "Report failed updaters" step files one tracking issue. Without
      # issues: write that gh api call returned 403
      # ("Resource not accessible by integration") and failed the whole job,
      # hiding the real failure it was trying to report (run 37198825220).
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - run: pip install requests

      - name: Run Custom Modules (update.sh)
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Running Custom Modules (update.sh)..."
          failed=0
          for script in $(find . -mindepth 2 -name "update.sh" -type f); do
            dir=$(dirname "$script")
            pkg=$(basename "$dir")
            echo ""
            echo "--- Updating $pkg ---"
            pushd "$dir" > /dev/null
            if bash update.sh; then
              echo "  -> OK"
            else
              echo "  -> FAILED (exit $?)"
              failed=$((failed + 1))
            fi
            popd > /dev/null
          done
          echo ""
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed update script(s) failed"
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
          else
            echo "failed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan Standard Packages via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import datetime, os, re, requests
          from pathlib import Path

          gh_token = os.environ.get('GITHUB_TOKEN')
          headers = {'Accept': 'application/vnd.github.v3+json'}
          if gh_token:
              headers['Authorization'] = f'token {gh_token}'

          # An RPM Version may not contain '-' (rpm-version(7)); several of these specs
          # derive Version straight from the upstream tag (%forgemeta -> %{fileref}), so
          # a re-roll tag like "v0.6.1-1" produced an unparsable spec and a hard COPR
          # failure (build 10841179). Only accept plain dotted release tags here.
          SANE_TAG = re.compile(r'^v?[0-9]+(\.[0-9]+)*$')

          def tag_is_sane(tag):
              return bool(tag) and bool(SANE_TAG.match(tag))

          for spec in Path('.').rglob('*.spec'):
              if (spec.parent / 'update.sh').exists():
                  continue

              print(f"Scanning {spec.parent.name}...")
              content = spec.read_text(encoding='utf-8')

              repo_match = re.search(r'https://github\.com/([^/\n\s"\']+)/([^/\n\s"\']+)', content, re.IGNORECASE)
              version_match = re.search(r'^Version:\s*([0-9a-zA-Z.-]+)', content, re.MULTILINE)
              tag_match = re.search(r'%global\s+tag\s+(.+)', content)

              if not repo_match:
                  print(f"  -> No GitHub URL found. Skipping.")
                  continue

              owner, repo = repo_match.group(1), repo_match.group(2)
              repo = re.sub(r'(\.git|/archive|/releases)$', '', repo, flags=re.IGNORECASE)

              current_ver = version_match.group(1).strip() if version_match else None
              current_tag = tag_match.group(1).strip() if tag_match else None

              try:
                  api_url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
                  res = requests.get(api_url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      latest_tag = res.json().get('tag_name', '')
                      latest_ver = latest_tag.lstrip('v')

                      if not tag_is_sane(latest_tag):
                          print(f"  -> [SKIP] upstream tag {latest_tag!r} is not a plain dotted version "
                                f"(illegal in an RPM Version). Leaving spec untouched.")
                          continue

                      new_content = content
                      changed = False
                      new_ver = None

                      if current_tag:
                          if latest_tag != current_tag:
                              new_content = re.sub(r'(%global\s+tag\s+).+', rf'\g<1>{latest_tag}', new_content)
                              changed = True
                              new_ver = latest_ver
                              print(f"  -> [UPDATE] {current_tag} -> {latest_tag}")
                          else:
                              print(f"  -> [OK] {current_tag}")
                      elif current_ver:
                          if latest_ver != current_ver:
                              new_content = re.sub(r'(^Version:\s+).+', rf'\g<1>{latest_ver}', new_content, flags=re.MULTILINE)
                              changed = True
                              new_ver = latest_ver
                              print(f"  -> [UPDATE] {current_ver} -> {latest_ver}")
                          else:
                              print(f"  -> [OK] {current_ver}")

                      if changed:
                          # A new upstream version restarts the release counter
                          # (rpm convention) instead of keeping a stale Release.
                          new_content = re.sub(r'(^Release:\s+)\d+.*', r'\g<1>1%{?dist}', new_content, flags=re.MULTILINE)
                          # Every bump ships its own %changelog entry.
                          date = datetime.datetime.now(datetime.timezone.utc).strftime('%a %b %d %Y')
                          entry = (f'* {date} Nexus Auto-Updater <bot@github.com> - {new_ver}-1\n'
                                   f'- Update to version {new_ver}\n\n')
                          new_content = re.sub(r'(%changelog\n)', r'\g<1>' + entry, new_content, count=1)
                          spec.write_text(new_content, encoding='utf-8')
                  else:
                      print(f"  -> [ERROR] GitHub API returned {res.status_code}")
              except Exception as e:
                  print(f"  -> [ERROR] {e}")
          print("scanner-errors: see [ERROR] lines above (0 if none)")
          PYEOF

      - name: Guard against version downgrades
        run: |
          # Every updater here compares with `!=`, which treats a TRANSIENT
          # upstream state as a newer version and "syncs" backwards. Two real
          # incidents, each costing a wasted COPR rebuild of an OLDER tarball
          # plus a second rebuild to come back:
          #   - zen-browser 64da796 (2026-10-16): upstream's release workflow
          #     deletes assets while re-running, so git ls-remote briefly
          #     showed 1.23.2b as latest -> spec went 1.23.3b -> 1.23.2b,
          #     restored by cf40866 the next run once the tag returned.
          #   - fluxer b0b7392 (2026-10-11): the rolling download URL served a
          #     stale (10-06) artifact after we shipped the 10-10 build,
          #     -> 2026.1010.155917 -> 2026.1006.171735, restored by 2c7ea42.
          # A lower Version under the same NVR would also silently replace
          # newer bits on users' systems. Downgrades are NEVER auto-valid:
          # revert the spec and keep watching; upstream recovering next run
          # (or a human/agent commit with an explicit rationale) is the only
          # way a version moves backwards.
          # Single choke point: covers all update.sh scripts AND the scanner
          # above without touching 56 individual scripts.
          reverted=0
          for f in $(git diff --name-only -- '*.spec'); do
            old_v=$(git show "HEAD:$f" 2>/dev/null | grep -m1 -E '^Version:' | awk '{print $2}')
            new_v=$(grep -m1 -E '^Version:' "$f" | awk '{print $2}')
            old_t=$(git show "HEAD:$f" 2>/dev/null | grep -m1 -E '^%global[[:space:]]+tag[[:space:]]+' | awk '{print $3}')
            new_t=$(grep -m1 -E '^%global[[:space:]]+tag[[:space:]]+' "$f" | awk '{print $3}')
            why=""
            if [ -n "$old_v" ] && [ -n "$new_v" ] && [ "$old_v" != "$new_v" ] \
               && [ "$(printf '%s\n%s\n' "$old_v" "$new_v" | sort -V | tail -1)" = "$old_v" ]; then
              why="Version $old_v -> $new_v"
            fi
            # Tag-driven specs (Version is a macro, e.g. protonplus %{fileref}).
            # Compare with the v- prefix stripped (v sorts after bare versions),
            # and ignore macro-computed tags (contain %) - the Version line is
            # authoritative for those (wlroots computes tag FROM %{version}).
            if [ -z "$why" ] && [ -n "$old_t" ] && [ -n "$new_t" ] \
               && [ "$old_t" != "$new_t" ] \
               && [[ "$old_t" != *%* && "$new_t" != *%* ]] \
               && [ "${old_t#v}" != "${new_t#v}" ] \
               && [ "$(printf '%s\n%s\n' "${old_t#v}" "${new_t#v}" | sort -V | tail -1)" = "${old_t#v}" ]; then
              why="tag $old_t -> $new_t"
            fi
            if [ -n "$why" ]; then
              echo "::warning::blocked downgrade in $f ($why); reverting - transient upstream state, not an update"
              git checkout HEAD -- "$f"
              reverted=$((reverted + 1))
            fi
          done
          echo "downgrades-reverted=$reverted"
          exit 0

      - name: Check for Changes
        id: changes
        run: |
          if ! git diff --quiet; then
            echo "updates_made=true" >> $GITHUB_OUTPUT
            echo "Changes found:"
            git diff --stat
          else
            echo "updates_made=false" >> $GITHUB_OUTPUT
            echo "No changes found."
          fi

      - name: Commit and Push
        if: steps.changes.outputs.updates_made == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "auto-update: sync spec files to latest upstream versions"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::rebase onto origin/main conflicted - aborting rather than pushing a broken history"
            exit 1
          fi
          pushed=0
          for i in 1 2 3; do
            if git push origin main; then
              pushed=1
              break
            fi
            echo "::warning::push attempt $i/3 failed"
            sleep 15
            git pull --rebase origin main || true
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::could not push to main after 3 attempts - version bump is NOT published"
            exit 1
          fi

      - name: Report failed updaters
        if: steps.updater.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="${{ steps.updater.outputs.failed }}"
          title="auto-updater: $n update.sh failed"
          exists=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$exists" -eq 0 ]; then
            # Never let the reporter itself fail the job: a token without
            # issues: write (or an API hiccup) must not mask the real failure.
            gh api repos/${GITHUB_REPOSITORY}/issues -f title="$title" -f body="update-engine run $GITHUB_RUN_ID: $n update.sh script(s) failed. The scan and version bumps still ran. Fix the scripts; see the run logs." \
              || echo "::warning::could not open the tracking issue (API refused); failing updaters are listed in the run log"
          else
            echo "issue already open - skipping"
          fi
          # Keep the failure loud in the run summary even when the issue path
          # is unavailable.
          echo "::error::$n update.sh script(s) failed in run $GITHUB_RUN_ID"
